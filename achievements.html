<!doctype html>
<html lang="zh" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <script>(function(){document.documentElement.setAttribute("data-theme",localStorage.getItem("theme")||"dark");})();</script>
    <title data-i18n-title="meta.achievements.title">科研成果 | CVPR-Lab</title>
    <meta name="description" data-i18n-meta="meta.achievements.description" content="CVPR实验室科研成果数据中心，展示论文、项目、专利与获奖信息。">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/effects.css">
    <link rel="stylesheet" href="assets/css/pages.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <noscript><style>.site-loader,.cursor-glow,.page-scanline{display:none}.fallback-content{padding:120px 24px 72px;max-width:960px;margin:auto}.fallback-content h1{font-size:40px;line-height:1.12}.fallback-content p,.fallback-content li{color:var(--color-muted);font-size:17px}.fallback-content a{color:var(--color-primary)}</style></noscript>
    <script defer src="assets/js/theme.js"></script>
    <script defer src="assets/js/i18n.js"></script>
    <script defer src="assets/js/data/achievements.js"></script>
    <script defer src="assets/js/components.js"></script>
    <script defer src="assets/js/render.js"></script>
    <script defer src="assets/js/effects.js"></script>
    <script defer src="assets/js/site.js"></script>
  </head>
  <body data-page="achievements">
    <div class="site-loader" id="site-loader" aria-hidden="true"><span></span><b>CVPR-LAB</b></div>
    <div class="cursor-glow" aria-hidden="true"></div>
    <div class="page-scanline" aria-hidden="true"></div>
    <header id="site-header" class="site-header"></header>
    <main id="page-root" class="page-root" data-page="achievements">
      <section class="fallback-content">
        <h1>科研成果</h1>
        <p>成果数据中心统一维护论文、项目、知识产权与荣誉奖励记录。统计数字由结构化成果数据自动生成，公开条目以可追溯来源和核验状态展示。</p>
        <ul>
          <li>论文：包含 DOI 或官方链接时优先展示。</li>
          <li>项目、专利、荣誉：保留来源说明和核验状态。</li>
        </ul>
      </section>
    </main>
    <footer id="site-footer" class="site-footer"></footer>
    <button id="back-to-top" class="back-to-top" type="button" aria-label="Back to top">↑</button>
  </body>
</html>
